services:
  # Networked SQLite-compatible database (Turso's open-source libSQL server).
  # Payload's SQLite adapter connects to it over the libsql/http protocol via
  # DATABASE_URL — the same protocol a managed libSQL/Turso host would use in
  # production, so no app code branches on local vs. hosted.
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    ports:
      - "8080:8080"
    volumes:
      - sqld_data:/var/lib/sqld
    restart: unless-stopped

  # S3-protocol object storage mimicking Cloudflare R2 for local dev. Speaks
  # the exact same protocol R2 does, so STORAGE_* env vars are the only
  # difference between local dev and production.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000" # S3 API
      - "9101:9001" # Web console
    environment:
      MINIO_ROOT_USER: fotopick
      MINIO_ROOT_PASSWORD: fotopick-local-dev
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the "fotopick" bucket and makes it publicly readable
  # (matching how a public R2 bucket is normally configured), then exits.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fotopick fotopick-local-dev &&
      mc mb -p local/fotopick &&
      mc anonymous set download local/fotopick
      "

volumes:
  sqld_data:
  minio_data:
